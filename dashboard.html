<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TaskNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">TaskNote</div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <section class="dashboard">
        <h1>Welcome to your Dashboard</h1>
        <p class="welcome-msg">Hello, <span id="userName">User</span>!</p>

        <div class="dashboard-content">
            <!-- Tasks Section -->
            <div class="dashboard-section">
                <h2>My Tasks</h2>
                <form id="taskForm" class="add-form">
                    <input type="text" id="taskInput" placeholder="Add a new task..." required>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </form>
                <ul id="taskList" class="task-list">
                    <!-- Tasks will be added here -->
                </ul>
            </div>

            <!-- Notes Section -->
            <div class="dashboard-section">
                <h2>My Notes</h2>
                <form id="noteForm" class="add-form">
                    <input type="text" id="noteTitle" placeholder="Note title..." required>
                    <textarea id="noteContent" placeholder="Write your note here..." required></textarea>
                    <button type="submit" class="btn btn-primary">Add Note</button>
                </form>
                <div id="notesList" class="notes-list">
                    <!-- Notes will be added here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>TaskNote - Digital Marketing Project</p>
    </footer>

    <!-- Load the Supabase library (from a CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
